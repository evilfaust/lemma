<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-new.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // iOS Safari приближает страницу при фокусе на поле со шрифтом < 16px (у antd — 14px)
      // и не отдаляет обратно после закрытия модалки. maximum-scale=1 отключает этот авто-зум;
      // щипок пальцами iOS всё равно разрешает (с iOS 10). Только iOS: на Android
      // maximum-scale запретил бы масштабирование вовсе.
      if (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover';
      }
    </script>
    <title>Lemma — Тестирование</title>
    <!-- Установка на телефон (PWA, v3.9.369): манифест, иконки, режим «как приложение» -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f8f9ff" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lemma" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифт не блокирует первую отрисовку (v3.9.374): пока таблица стилей
         едет с Google, страница рисуется системным шрифтом (display=swap). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
    <!--
      Заставка запуска (v3.9.373): пока грузятся скрипты, у установленного
      приложения был белый экран — казалось, что оно зависло. Стили и разметка
      лежат прямо здесь, без бандла: React заменит содержимое #root первым же
      рендером. Те же классы рисует BootSpinner (src/student/pwa/BootSpinner.jsx)
      на время загрузки отдельных экранов.
    -->
    <style>
      body { margin: 0; background: #f8f9ff; }
      html.boot-dark, html.boot-dark body { background: #0d0d1a; }
      .boot {
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px;
        background: #f8f9ff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #6b7280; font-size: 15px;
      }
      html.boot-dark .boot { background: #0d0d1a; color: #9ca3af; }
      .boot--inline { min-height: 50vh; background: transparent !important; }
      .boot-logo { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 6px 20px rgba(67, 97, 238, 0.18); }
      .boot-spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(67, 97, 238, 0.18); border-top-color: #4361ee;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-spinner--sm { width: 18px; height: 18px; border-width: 2px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 2.4s; } }
    </style>
    <script>
      // Тёмная тема ученика — до первой отрисовки, иначе заставка мигнёт белым.
      try {
        if (localStorage.getItem('student-theme') === 'dark') {
          document.documentElement.classList.add('boot-dark');
          document.querySelector('meta[name=theme-color]').content = '#0d0d1a';
        }
      } catch (e) { /* приватный режим */ }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Загрузка">
        <img class="boot-logo" src="/pwa/icon-192.png" alt="" />
        <div class="boot-spinner"></div>
        <div>Загружаем Lemma…</div>
      </div>
    </div>
    <script type="module" src="/src/student/main.jsx"></script>
  </body>
</html>
